name: Build Windows Installer

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage app folder (Python + Node + ffmpeg + yt-dlp)
        shell: pwsh
        env:
          # Baked into the installer as default API keys (see build.ps1's step 5 and
          # web/config.py) so end users don't need to configure anything. Sourced only
          # from GitHub Actions secrets — never write real keys into a tracked file.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: .\packaging\windows\build.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\kirinuki.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KirinukiSetup
          path: dist/KirinukiSetup.exe
          if-no-files-found: error

      # Runs only when this build was triggered by a version tag push (e.g. `v0.1.0`),
      # so manual workflow_dispatch test builds stay artifact-only and don't spam Releases.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KirinukiSetup.exe
          generate_release_notes: true

