name: Build Windows Installer

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage app folder (Python + Node + ffmpeg + yt-dlp)
        shell: pwsh
        env:
          # Baked into the installer as default API keys (see build.ps1's step 5 and
          # web/config.py) so end users don't need to configure anything. Sourced only
          # from GitHub Actions secrets — never write real keys into a tracked file.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: .\packaging\windows\build.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\kirinuki.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KirinukiSetup
          path: dist/KirinukiSetup.exe
          if-no-files-found: error
